name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Emscripten
      uses: mymindstorm/setup-emsdk@v12
      with:
        version: latest
    
    - name: Build with Emscripten
      run: |
        mkdir -p build_web
        cd build_web
        emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
        emmake make -j4
    
    - name: Prepare GitHub Pages
      run: |
        mkdir -p docs
        cp build_web/game.js docs/ || echo "game.js not found"
        cp build_web/game.wasm docs/ || echo "game.wasm not found"
        cp build_web/game.html docs/index.html || echo "game.html not found"
        ls -la docs/
    
    - name: Setup Pages
      uses: actions/configure-pages@v3
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: 'docs'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2